name: Precios cada 15 min

on:
  schedule:
    # minutos no redondos: GitHub demora o saltea más las corridas programadas en :00 y :15
    - cron: "7,22,37,52 13-19 * * 1-5"   # 10:07 a 16:52 hora Argentina
    - cron: "12 20 * * 1-5"               # 17:12 hora Argentina (cierre)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04   # fijo: "latest" pasa a Ubuntu 26 el 19/10/2026; se cambia a propósito, no solo
    timeout-minutes: 10
    env:
      DATA_DIR: _datos
    steps:
      - uses: actions/checkout@v4
      # Los datos viven en la rama "datos", que se reescribe en cada corrida con un único commit:
      # así el repositorio no crece con cada actualización.
      - name: Traer los datos actuales (rama datos)
        uses: actions/checkout@v4
        with:
          ref: datos
          path: _datos
        continue-on-error: true
      - name: "Primera vez: arrancar desde docs/data"
        run: |
          if [ ! -f _datos/prices.json ] && [ ! -f _datos/daily.json ]; then
            rm -rf _datos && mkdir -p _datos && cp -r docs/data/. _datos/
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # uv instala las librerías mucho más rápido que pip y las guarda en caché entre corridas
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - run: uv pip install --system -r requirements.txt
      - name: Bajar datos
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/fetch_prices.py
      - name: Publicar en la rama datos (un solo commit, sin historia)
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd _datos
          rm -rf .git
          git init -q -b datos
          git config user.name "terminal-bot"
          git config user.email "terminal-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "datos: precios $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
